name: Assemble beta.4 release assets
on: workflow_dispatch
permissions:
  contents: write
jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Reuse public resources and reconstruct the verified portable ZIP
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          LAYOUT_SHA256: 0dc10e131a67308997b852e6c85294036fe55b500001fa249e68d813fa976be9
          CATALOG_SHA256: 51b548502284b9a8fe00218b7ea2ddfbe2a0b70eb68aa860dde74cf9dc4e3759
        run: |
          """One-time public-asset transport. Contains no application source or keys."""
          import hashlib,json,os,subprocess
          from pathlib import Path
          repo='AoralsFout/thmr-filter-node';tag='v0.4.0-beta.4';release_id=446094468
          def gh(*args):return subprocess.check_output(['gh',*args],text=True).strip()
          def digest(path):
           with Path(path).open('rb') as stream:return hashlib.file_digest(stream,'sha256').hexdigest()
          def state():return json.loads(gh('api',f'repos/{repo}/releases/{release_id}'))
          value=state();assert value['draft'] and value['tag_name']==tag
          work=Path('release-transfer');work.mkdir()
          def download(version,name):
           assert Path(name).name==name
           target=work/name
           if not target.exists():gh('release','download',version,'--repo',repo,'--pattern',name,'--dir',str(work))
           return target
          layout=download(tag,'portable-composition.json')
          assert digest(layout)==os.environ['LAYOUT_SHA256']
          manifest=json.loads(layout.read_text())
          patch=download(tag,manifest['patch']['filename']);assert digest(patch)==manifest['patch']['sha256']
          streams={'patch':patch.open('rb')}
          for key,source in manifest['sources'].items():
           assert source['tag'] in ('v0.4.0-beta.2',tag)
           file=download(source['tag'],source['filename']);assert digest(file)==source['sha256']
           streams[key]=file.open('rb')
          portable=work/manifest['target']['filename']
          with portable.open('xb') as result:
           for block in manifest['chunks']:
            stream=streams[block['source']];stream.seek(block['offset']);data=stream.read(block['size'])
            assert len(data)==block['size'] and hashlib.sha256(data).hexdigest()==block['sha256']
            result.write(data)
          for stream in streams.values():stream.close()
          assert portable.stat().st_size==manifest['target']['size'] and digest(portable)==manifest['target']['sha256']
          def upload(file,expected):
           value=state();assert value['draft'] and value['tag_name']==tag
           existing=next((a for a in value['assets'] if a['name']==file.name),None)
           if existing:
            if existing['state']=='uploaded':
             assert existing['digest']=='sha256:'+expected
             return
            assert existing['state']=='starter'
            gh('api',f'repos/{repo}/releases/assets/{existing["id"]}','--method','DELETE')
           gh('release','upload',tag,str(file),'--repo',repo)
           actual=next(a for a in state()['assets'] if a['name']==file.name)
           assert actual['state']=='uploaded' and actual['digest']=='sha256:'+expected
           print('Verified uploaded asset:',file.name,flush=True)
          upload(portable,manifest['target']['sha256'])
          catalog_file=download(tag,'resource-catalog.json');assert digest(catalog_file)==os.environ['CATALOG_SHA256']
          catalog=json.loads(catalog_file.read_text())
          for record in catalog['resources']:
           for asset in record.get('parts',[record]):
            old=asset['filename'].replace('0.4.0-beta.4','0.4.0-beta.2')
            original=download('v0.4.0-beta.2',old)
            assert original.stat().st_size==asset['size'] and digest(original)==asset['sha256']
            renamed=work/asset['filename'];original.rename(renamed)
            upload(renamed,asset['sha256'])
            renamed.unlink()
          for asset in state()['assets']:
           if asset['name'] in ('portable-composition.json','portable-composition.bin'):
            gh('api',f'repos/{repo}/releases/assets/{asset["id"]}','--method','DELETE')
          print('Exact portable reconstruction and all unchanged model assets uploaded.')
